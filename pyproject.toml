[project]
name = "nb"
version = "0.1.0"
description = "Knowledge base del team su git: ricerca locale, interrogata da Claude Code"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed>=0.4",
  "numpy>=1.26",
  "pyyaml>=6",
  "typer>=0.12",
  "mcp>=1.2",
]

[project.scripts]
nb = "nb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nb"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: test di prestazioni", "modello: scarica il modello reale"]
addopts = "-m 'not lento and not modello'"
